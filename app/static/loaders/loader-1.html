<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader 1 · Terminal Breach</title>
<style>
@font-face { font-family: "Plex Mono"; src: url("../fonts/plexmono-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Plex Mono"; src: url("../fonts/plexmono-600.woff2") format("woff2"); font-weight: 600; }
:root { --c1:#38bdf8; --c2:#2dd4bf; --ok:#2fd18b; --bad:#ff5d6c; --muted:#5f7387; --bg:#04070b; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: #cfefff; overflow: hidden;
  font: 14px/1.5 "Plex Mono", ui-monospace, Consolas, monospace; cursor: pointer; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#stage { position: fixed; inset: 0; will-change: transform, filter; }
#term { position: absolute; left: 6vw; top: 12vh; width: min(58vw, 820px); height: 64vh; overflow: hidden;
  border-left: 1px solid rgba(56,189,248,.35); padding-left: 22px;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 100%);
          mask-image: linear-gradient(to bottom, transparent 0, #000 18%, #000 100%); }
#term .inner { position: absolute; left: 22px; right: 0; bottom: 0; }
.ln { white-space: pre; color: #a9d9ef; text-shadow: 0 0 8px rgba(56,189,248,.35); }
.ln .p { color: var(--c2); } .ln .dim { color: var(--muted); }
.ln .ok { color: var(--ok); text-shadow: 0 0 10px rgba(47,209,139,.6); }
.ln .warn { color: #ffb547; }
.cur { display: inline-block; width: .6em; height: 1.05em; vertical-align: -2px; background: var(--c1); box-shadow: 0 0 10px var(--c1); }
#prog { position: absolute; left: 6vw; bottom: 12vh; width: min(58vw, 820px); }
#prog .lbl { display: flex; justify-content: space-between; font-size: 12px; letter-spacing: .18em; color: var(--c1); }
#prog .bar { margin-top: 10px; height: 3px; background: rgba(56,189,248,.12); position: relative; overflow: visible; }
#prog .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--c1), var(--c2)); box-shadow: 0 0 14px var(--c2); }
#prog .seg { margin-top: 8px; font-size: 11px; color: var(--muted); letter-spacing: .1em; white-space: pre; }
#granted { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; opacity: 0; }
#granted .wrap { text-align: center; }
#granted h1 { margin: 0; font-weight: 600; font-size: clamp(42px, 7vw, 108px); letter-spacing: .14em; color: var(--ok);
  text-shadow: 0 0 18px rgba(47,209,139,.7), 0 0 60px rgba(47,209,139,.35); }
#granted p { margin: 14px 0 0; color: #bff5dc; letter-spacing: .32em; font-size: 13px; }
#flash { position: fixed; inset: 0; background: #e8fbff; opacity: 0; pointer-events: none; mix-blend-mode: screen; }
.scan { position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); }
.vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75)); }
.tag { position: fixed; left: 18px; top: 14px; font-size: 11px; letter-spacing: .22em; color: var(--muted); z-index: 5; }
.tag a { color: var(--c1); text-decoration: none; }
.hint { position: fixed; right: 18px; bottom: 14px; font-size: 11px; letter-spacing: .22em; color: var(--muted); z-index: 5; }
</style>
</head>
<body>
<canvas id="hex"></canvas>
<div id="stage">
  <div id="term"><div class="inner" id="lines"></div></div>
  <div id="prog">
    <div class="lbl"><span id="plbl">DECRYPTING BIOMETRIC SIGNATURE</span><span id="pct">0%</span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="seg" id="seg"></div>
  </div>
</div>
<canvas id="glitch"></canvas>
<div id="granted"><div class="wrap"><h1 id="gh">ACCESS GRANTED</h1><p id="gp"></p></div></div>
<div id="flash"></div>
<div class="scan"></div><div class="vig"></div>
<div class="tag"><a href="index.html">&larr; SAMPLES</a> &nbsp;/&nbsp; 01 · TERMINAL BREACH</div>
<div class="hint">CLICK TO REPLAY</div>
<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const FT = Q.has('t') ? parseFloat(Q.get('t')) : null;
  const NAME = (Q.get('name') || 'ALTAIR').toUpperCase();
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GRANT = 3.55, CYCLE = 7;
  let t0 = performance.now();
  addEventListener('click', e => { if (!e.target.closest('a')) t0 = performance.now(); });
  const clock = () => FT != null ? FT : RM ? GRANT + 1.5 : ((performance.now() - t0) / 1000) % CYCLE;
  const hash = (a, b = 0) => { const x = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const HEX = '0123456789ABCDEF';
  const hx = (n, s) => { let o = ''; for (let i = 0; i < n; i++) o += HEX[Math.floor(hash(s, i) * 16)]; return o; };

  // [start time, text, status]
  const L = [
    [0.00, '<span class="p">faceid@gate</span>:<span class="dim">~#</span> ./breach --target=vault --bio', ''],
    [0.18, '[ 0.0021] init quantum entropy pool .............', 'OK'],
    [0.34, '[ 0.0107] tls1.3 handshake  ecdhe-x25519 -> 0x' + hx(12, 1), 'OK'],
    [0.52, '[ 0.0198] negotiating cipher  AES-256-GCM / SHA3-512', 'OK'],
    [0.70, '[ 0.0311] loading insightface core  kps=5  dim=512', 'OK'],
    [0.86, '[ 0.0432] capture frame 1920x1080  luma=0.71  blur=0.02', 'OK'],
    [1.02, '[ 0.0587] landmarks  L_EYE R_EYE NOSE M_L M_R', 'LOCKED'],
    [1.20, '[ 0.0712] embedding -> 0x' + hx(32, 2), ''],
    [1.38, '[ 0.0891] bio-hash sha3  ' + hx(24, 3) + '…', 'MATCH'],
    [1.56, '[ 0.1022] cross-check vault index  shards 64/64', 'OK'],
    [1.74, '[ 0.1180] liveness  depth=0.94  blink=1  spoof=0.003', 'PASS'],
    [1.92, '[ 0.1312] decrypt session key  ████████████████', 'OK'],
    [2.10, '[ 0.1475] firewall  ICE layer 3 bypass ...........', 'WARN'],
    [2.26, '[ 0.1520] rerouting via node 0x' + hx(6, 4) + ' ............', 'OK'],
    [2.44, '[ 0.1688] cosine similarity  0.9873  (thr 0.42)', 'MATCH'],
    [2.62, '[ 0.1801] privilege escalation  uid=0(root)', 'OK'],
    [2.80, '[ 0.1955] signing token  jwt.hs512.' + hx(10, 5), 'OK'],
    [2.98, '[ 0.2104] identity resolved  ->  ' + NAME, 'VERIFIED'],
    [3.16, '[ 0.2230] opening gate ...', ''],
  ];
  const CPS = 170;
  const linesEl = document.getElementById('lines');
  const tagCls = s => s === 'WARN' ? 'warn' : 'ok';
  function strip(h) { return h.replace(/<[^>]+>/g, ''); }
  function typed(html, n) { // reveal n visible chars of html
    let out = '', c = 0, i = 0;
    while (i < html.length && c < n) {
      if (html[i] === '<') { const j = html.indexOf('>', i); out += html.slice(i, j + 1); i = j + 1; continue; }
      out += html[i++]; c++;
    }
    const opens = (out.match(/<span/g) || []).length, closes = (out.match(/<\/span>/g) || []).length;
    return out + '</span>'.repeat(Math.max(0, opens - closes));
  }
  function renderTerm(t) {
    let h = '';
    for (let k = 0; k < L.length; k++) {
      const [st, txt, s] = L[k];
      if (t < st) break;
      const n = Math.floor((t - st) * CPS), len = strip(txt).length;
      const done = n >= len;
      const next = L[k + 1] && t >= L[k + 1][0];
      h += '<div class="ln">' + typed(txt, n) + (done && s ? '  <span class="' + tagCls(s) + '">[' + s + ']</span>' : '')
        + (!next ? ' <span class="cur" style="opacity:' + (Math.floor(t * 4) % 2 ? .2 : 1) + '"></span>' : '') + '</div>';
    }
    linesEl.innerHTML = h;
  }

  // hex dump canvas
  const cv = document.getElementById('hex'), cx = cv.getContext('2d');
  const gv = document.getElementById('glitch'), gx = gv.getContext('2d');
  let W, H, DPR;
  function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight;
    for (const c of [cv, gv]) { c.width = W * DPR; c.height = H * DPR; }
    cx.setTransform(DPR, 0, 0, DPR, 0, 0); gx.setTransform(DPR, 0, 0, DPR, 0, 0); }
  size(); addEventListener('resize', size);

  function renderHex(t) {
    cx.clearRect(0, 0, W, H);
    cv.style.opacity = t >= GRANT ? Math.max(.25, 1 - (t - GRANT) * 1.5) : 1;
    const x0 = Math.max(W * 0.68, W * 0.06 + Math.min(W * .58, 820) + 60), rowH = 17;
    const speed = t < GRANT ? 320 + t * 260 : 320 + GRANT * 260;
    const off = (t * speed);
    cx.font = '12px "Plex Mono", Consolas, monospace';
    const first = Math.floor(off / rowH);
    for (let r = -1; r < H / rowH + 1; r++) {
      const row = first + r, y = r * rowH - (off % rowH) + 12;
      const fade = Math.sin(clamp(y / H) * Math.PI);
      cx.fillStyle = `rgba(95,115,135,${0.55 * fade})`;
      cx.fillText((row * 16 >>> 0).toString(16).padStart(8, '0').toUpperCase(), x0, y);
      for (let c = 0; c < 8; c++) {
        const v = hash(row, c);
        const hot = hash(row, c + 50) > 0.93;
        cx.fillStyle = hot ? `rgba(45,212,191,${fade})` : `rgba(56,189,248,${0.35 * fade})`;
        cx.fillText(HEX[(v * 16) | 0] + HEX[(v * 256 & 15)], x0 + 84 + c * 26, y);
      }
    }
    // side readouts
    cx.fillStyle = 'rgba(56,189,248,.55)';
    cx.font = '11px "Plex Mono", Consolas, monospace';
    const pk = Math.floor(clamp(t / GRANT) * 48231);
    cx.fillText('PKT ' + String(pk).padStart(6, '0') + '  RX ' + (t * 113.7).toFixed(1) + ' MB/s', x0, H - 40);
  }

  function renderGlitch(t) {
    gx.clearRect(0, 0, W, H);
    const g = clamp((t - (GRANT - 0.42)) / 0.42) * (t < GRANT + 0.18 ? 1 : 0);
    const stage = document.getElementById('stage');
    if (g > 0) {
      const f = Math.floor(t * 30);
      stage.style.transform = `translate(${(hash(f, 1) - .5) * 40 * g}px, ${(hash(f, 2) - .5) * 8 * g}px) skewX(${(hash(f, 3) - .5) * 8 * g}deg)`;
      stage.style.filter = `hue-rotate(${hash(f, 4) * 40 * g}deg) contrast(${1 + g}) drop-shadow(${6 * g}px 0 rgba(255,93,108,.8)) drop-shadow(${-6 * g}px 0 rgba(56,189,248,.9))`;
      for (let i = 0; i < 14 * g + 3; i++) {
        const y = hash(f, i + 10) * H, h = 2 + hash(f, i + 40) * 26;
        gx.fillStyle = hash(f, i + 70) > .5 ? 'rgba(56,189,248,.35)' : (hash(f, i + 90) > .6 ? 'rgba(255,93,108,.3)' : 'rgba(230,251,255,.18)');
        gx.fillRect(hash(f, i + 20) * W * .3, y, W * (.3 + hash(f, i + 30) * .7), h);
      }
    } else { stage.style.transform = ''; stage.style.filter = ''; }
    stage.style.opacity = t >= GRANT ? Math.max(0, 0.12 - (t - GRANT) * .05) : 1;
  }

  const fill = document.getElementById('fill'), pct = document.getElementById('pct'), seg = document.getElementById('seg'), plbl = document.getElementById('plbl');
  const STAGES = ['HANDSHAKE', 'DECRYPT', 'BIO-HASH', 'LIVENESS', 'ESCALATE', 'VERIFY'];
  function renderProg(t) {
    const p = clamp((t - 0.15) / (GRANT - 0.55));
    const e = p < 1 ? p - Math.sin(p * Math.PI * 6) * 0.015 : 1;
    fill.style.width = (e * 100).toFixed(2) + '%';
    pct.textContent = Math.floor(p * 100) + '%';
    const si = Math.min(STAGES.length - 1, Math.floor(p * STAGES.length));
    plbl.textContent = p >= 1 ? 'SIGNATURE DECRYPTED' : 'DECRYPTING BIOMETRIC SIGNATURE // ' + STAGES[si];
    seg.textContent = STAGES.map((s, i) => (i < si || p >= 1 ? '■ ' : i === si ? (Math.floor(t * 8) % 2 ? '□ ' : '■ ') : '□ ') + s).join('   ');
  }

  const gr = document.getElementById('granted'), gh = document.getElementById('gh'), gp = document.getElementById('gp'), fl = document.getElementById('flash');
  const FINAL = 'ACCESS GRANTED', GLY = '#$%&*+<>/\\|=01ABCDEF';
  function renderGrant(t) {
    const d = t - GRANT;
    fl.style.opacity = d >= 0 && d < .35 ? (1 - d / .35) * .85 : 0;
    if (d < 0) { gr.style.opacity = 0; return; }
    gr.style.opacity = clamp(d / .12);
    gh.style.letterSpacing = (0.14 + Math.max(0, .6 - d) * .5).toFixed(3) + 'em';
    let s = '';
    for (let i = 0; i < FINAL.length; i++) s += (FINAL[i] === ' ' || d > 0.05 + i * 0.035) ? FINAL[i] : GLY[(hash(Math.floor(t * 40), i) * GLY.length) | 0];
    gh.textContent = s;
    const sub = 'WELCOME BACK, ' + NAME + '  //  CLEARANCE: ROOT';
    gp.textContent = sub.slice(0, Math.floor(clamp((d - .35) * 60, 0, sub.length)));
  }

  function frame() {
    const t = clock();
    renderTerm(t); renderHex(t); renderProg(t); renderGlitch(t); renderGrant(t);
    if (FT == null && !RM) requestAnimationFrame(frame);
  }
  frame();
  if (RM || FT != null) { addEventListener('resize', frame); document.fonts && document.fonts.ready.then(frame); }
})();
</script>
</body>
</html>
