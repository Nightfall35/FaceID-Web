<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loader 2 · Code Rain Face Lock</title>
<style>
@font-face { font-family: "Plex Mono"; src: url("../fonts/plexmono-400.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Plex Mono"; src: url("../fonts/plexmono-600.woff2") format("woff2"); font-weight: 600; }
:root { --c1:#38bdf8; --c2:#2dd4bf; --ok:#2fd18b; --muted:#5f7387; }
html, body { margin: 0; height: 100%; background: #020507; overflow: hidden; color: #cfefff;
  font: 14px/1.5 "Plex Mono", ui-monospace, Consolas, monospace; cursor: pointer; user-select: none; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#hud { position: fixed; left: 0; right: 0; bottom: 7vh; text-align: center; pointer-events: none; }
#st { font-size: 12px; letter-spacing: .35em; color: var(--c1); text-shadow: 0 0 10px rgba(56,189,248,.6); }
#big { margin: 8px 0 0; font-weight: 600; font-size: clamp(34px, 5vw, 72px); letter-spacing: .18em; color: var(--ok); opacity: 0;
  text-shadow: 0 0 18px rgba(47,209,139,.75), 0 0 60px rgba(47,209,139,.35); }
#sub { margin-top: 6px; font-size: 12px; letter-spacing: .3em; color: #bff5dc; opacity: 0; }
.vig { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.8)); }
.tag { position: fixed; left: 18px; top: 14px; font-size: 11px; letter-spacing: .22em; color: var(--muted); z-index: 5; }
.tag a { color: var(--c1); text-decoration: none; }
.hint { position: fixed; right: 18px; bottom: 14px; font-size: 11px; letter-spacing: .22em; color: var(--muted); z-index: 5; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="vig"></div>
<div id="hud"><div id="st">INITIALISING</div><div id="big">ACCESS GRANTED</div><div id="sub"></div></div>
<div class="tag"><a href="index.html">&larr; SAMPLES</a> &nbsp;/&nbsp; 02 · CODE RAIN FACE LOCK</div>
<div class="hint">CLICK TO REPLAY</div>
<script>
(() => {
  const Q = new URLSearchParams(location.search);
  const FT = Q.has('t') ? parseFloat(Q.get('t')) : null;
  const NAME = (Q.get('name') || 'ALTAIR').toUpperCase();
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GRANT = 3.5, CYCLE = 7;
  let t0 = performance.now();
  addEventListener('click', e => { if (!e.target.closest('a')) t0 = performance.now(); });
  const clock = () => FT != null ? FT : RM ? GRANT + 1.5 : ((performance.now() - t0) / 1000) % CYCLE;
  const hash = (a, b = 0, c = 0) => { const x = Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453; return x - Math.floor(x); };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const ease = x => 1 - Math.pow(1 - clamp(x), 3);
  const GL = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワ0123456789ABCDEF<>/=*+';
  const glyph = (a, b, c) => GL[(hash(a, b, c) * GL.length) | 0];

  const cv = document.getElementById('cv'), g = cv.getContext('2d');
  let W, H, DPR;
  function size() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0); }
  size(); addEventListener('resize', () => { size(); if (FT != null || RM) frame(); });

  // ---- face model (unit: face height ~1.04, centred) ----
  const V = [], E = [], LM = [];
  const add = (x, y, zb = 0) => { const r = clamp(1 - (x / 0.42) ** 2 - (y / 0.58) ** 2); V.push([x, y, Math.sqrt(r) * 0.32 + zb]); return V.length - 1; };
  const oval = (s, n) => { const ids = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, y = -Math.cos(a) * 0.52 * s; const x = Math.sin(a) * 0.37 * s * (1 - 0.22 * Math.max(0, y / (0.52 * s))); ids.push(add(x, y)); } return ids; };
  const R1 = oval(1, 28), R2 = oval(0.74, 28);
  for (let i = 0; i < 28; i++) { const j = (i + 1) % 28; E.push([R1[i], R1[j]], [R2[i], R2[j]], [R1[i], R2[i]], [R1[i], R2[j]]); }
  const ring = (cx, cy, rx, ry, n, zb) => { const ids = []; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; ids.push(add(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, zb)); } for (let i = 0; i < n; i++) E.push([ids[i], ids[(i + 1) % n]]); return ids; };
  const eL = ring(-0.14, -0.07, 0.07, 0.03, 8, 0), eR = ring(0.14, -0.07, 0.07, 0.03, 8, 0);
  const mo = ring(0, 0.26, 0.13, 0.035, 10, 0);
  const nb = add(0, -0.08, 0.04), nt = add(0, 0.12, 0.16), nl = add(-0.055, 0.15, 0.06), nr = add(0.055, 0.15, 0.06);
  E.push([nb, nt], [nt, nl], [nt, nr], [nl, nr]);
  const bL = [add(-0.22, -0.16), add(-0.14, -0.19), add(-0.06, -0.165)], bR = [add(0.06, -0.165), add(0.14, -0.19), add(0.22, -0.16)];
  E.push([bL[0], bL[1]], [bL[1], bL[2]], [bR[0], bR[1]], [bR[1], bR[2]]);
  const feat = [...eL, ...eR, ...mo, nb, nt, nl, nr, ...bL, ...bR];
  for (const id of R2) { let best = -1, bd = 1e9; for (const f of feat) { const d = (V[id][0] - V[f][0]) ** 2 + (V[id][1] - V[f][1]) ** 2; if (d < bd) { bd = d; best = f; } } E.push([id, best]); }
  E.push([nb, bL[2]], [nb, bR[0]], [nl, mo[5]], [nr, mo[0]]);
  // 5-point landmarks (InsightFace kps order)
  LM.push(['L_EYE', add(-0.14, -0.07, 0.02)], ['R_EYE', add(0.14, -0.07, 0.02)], ['NOSE', nt], ['MOUTH_L', mo[5]], ['MOUTH_R', mo[0]]);
  const arrive = V.map((_, i) => 0.7 + hash(i, 9) * 1.5);

  function frame() {
    const t = clock();
    const gr = clamp((t - GRANT) / 0.5);
    const lock = clamp((t - 0.7) / 2.4);
    g.fillStyle = '#020507'; g.fillRect(0, 0, W, H);

    const S = Math.min(H * 0.62, W * 0.8), FX = W / 2, FY = H * 0.43;
    const yaw = (1 - ease((t - 1.6) / 1.6)) * Math.sin(t * 2.1) * 0.5;
    const proj = v => { const c = Math.cos(yaw), s = Math.sin(yaw); const x = v[0] * c + v[2] * s, z = -v[0] * s + v[2] * c; const k = 1 + z * 0.35; return [FX + x * S * k, FY + v[1] * S * k, z]; };

    // ---- code rain ----
    const CW = 18, rows = Math.ceil(H / CW) + 1, cols = Math.ceil(W / CW);
    g.font = '15px "Plex Mono", Consolas, monospace'; g.textAlign = 'center'; g.textBaseline = 'middle';
    const rc = [56 + (47 - 56) * gr, 189 + (209 - 189) * gr, 248 + (139 - 248) * gr];
    for (let c = 0; c < cols; c++) {
      const sp = (7 + hash(c, 1) * 14) * (1 - gr * 0.7), trail = 8 + (hash(c, 2) * 22) | 0, per = rows + trail + (hash(c, 3) * 20 | 0);
      const head = (t * sp + hash(c, 4) * per) % per;
      const x = c * CW + CW / 2;
      for (let k = 0; k < trail; k++) {
        const r = Math.floor(head) - k; if (r < 0 || r >= rows) continue;
        const y = r * CW;
        const dx = (x - FX) / (S * 0.42), dy = (y - FY) / (S * 0.6), inside = dx * dx + dy * dy < 1;
        let a = (1 - k / trail) * (0.85 - (inside ? lock * 0.65 : lock * 0.25));
        if (k === 0) { g.fillStyle = `rgba(225,250,255,${0.95 - lock * .3})`; }
        else g.fillStyle = `rgba(${rc[0] | 0},${rc[1] | 0},${rc[2] | 0},${a})`;
        g.fillText(glyph(c, r, Math.floor(t * 6 + hash(c, r) * 10)), x, y);
      }
    }

    // ---- face mesh resolving out of the rain ----
    const P = V.map(proj);
    const col = gr > 0 ? `47,209,139` : `56,189,248`;
    g.lineWidth = 1;
    for (const [a, b] of E) {
      const la = clamp((t - Math.max(arrive[a], arrive[b]) - 0.1) / 0.5); if (la <= 0) continue;
      const pa = P[a], pb = P[b], z = (pa[2] + pb[2]) / 2;
      g.strokeStyle = `rgba(${col},${la * (0.25 + z * 1.1) * (1 + gr * .6)})`;
      g.beginPath(); g.moveTo(pa[0], pa[1]); g.lineTo(pa[0] + (pb[0] - pa[0]) * la, pa[1] + (pb[1] - pa[1]) * la); g.stroke();
    }
    g.font = '600 14px "Plex Mono", Consolas, monospace';
    g.shadowBlur = 12;
    for (let i = 0; i < V.length; i++) {
      const p = P[i], ta = arrive[i];
      if (t < ta - 0.9) continue;
      const fall = t < ta ? (ta - t) * H * 0.9 : 0;
      const a = t < ta ? 0.55 : 1;
      g.shadowColor = gr > 0 ? '#2fd18b' : '#38bdf8';
      g.fillStyle = t < ta ? 'rgba(200,245,255,.8)' : gr > 0 ? `rgba(160,255,210,${a})` : `rgba(140,225,255,${a * (0.6 + p[2])})`;
      g.fillText(t < ta ? glyph(i, Math.floor(t * 12)) : glyph(i, 99), p[0], p[1] - fall);
      if (t >= ta && t < ta + 0.25) { g.strokeStyle = `rgba(225,250,255,${1 - (t - ta) / .25})`; g.beginPath(); g.arc(p[0], p[1], 3 + (t - ta) * 40, 0, Math.PI * 2); g.stroke(); }
    }
    g.shadowBlur = 0;

    // ---- 5-point landmark reticles ----
    const lmA = clamp((t - 2.2) / 0.4);
    if (lmA > 0) {
      g.font = '11px "Plex Mono", Consolas, monospace'; g.textAlign = 'left';
      LM.forEach(([name, id], i) => {
        const p = P[id], a = clamp(lmA * 1.5 - i * 0.12), r = 14 + (1 - a) * 30, k = 6;
        g.strokeStyle = `rgba(${gr > 0 ? '47,209,139' : '45,212,191'},${a})`; g.lineWidth = 1.5;
        for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) { g.beginPath(); g.moveTo(p[0] + sx * r, p[1] + sy * (r - k)); g.lineTo(p[0] + sx * r, p[1] + sy * r); g.lineTo(p[0] + sx * (r - k), p[1] + sy * r); g.stroke(); }
        const side = p[0] < FX ? -1 : 1, lx = FX + side * S * 0.5, ly = p[1] + (i - 2) * 6;
        g.lineWidth = 1; g.strokeStyle = `rgba(56,189,248,${a * .5})`;
        g.beginPath(); g.moveTo(p[0] + side * r, p[1]); g.lineTo(lx - side * 8, ly); g.stroke();
        g.fillStyle = `rgba(207,239,255,${a})`; g.textAlign = side < 0 ? 'right' : 'left';
        const conf = (0.97 + hash(i, 5) * 0.029).toFixed(3);
        g.fillText(`${name}  ${conf}  [${Math.round(p[0])},${Math.round(p[1])}]`, lx, ly);
      });
      g.textAlign = 'center';
    }
    // scanning sweep line while locking
    if (t > 0.5 && t < GRANT) { const sy = FY - S * 0.6 + ((t * 0.9) % 1) * S * 1.2; const gd = g.createLinearGradient(0, sy - 30, 0, sy); gd.addColorStop(0, 'rgba(45,212,191,0)'); gd.addColorStop(1, 'rgba(45,212,191,.25)'); g.fillStyle = gd; g.fillRect(FX - S * 0.5, sy - 30, S, 30); g.fillStyle = 'rgba(160,250,235,.7)'; g.fillRect(FX - S * 0.5, sy, S, 1); }
    // grant pulse
    if (gr > 0 && gr < 1) { g.strokeStyle = `rgba(47,209,139,${1 - gr})`; g.lineWidth = 2; g.beginPath(); g.ellipse(FX, FY, S * (0.42 + gr * 0.5), S * (0.58 + gr * 0.5), 0, 0, Math.PI * 2); g.stroke(); }

    // ---- HUD text ----
    const st = document.getElementById('st'), big = document.getElementById('big'), sub = document.getElementById('sub');
    const arrived = arrive.filter(a => a <= t).length;
    if (t < GRANT) {
      const phase = t < 0.7 ? 'INTERCEPTING SIGNAL STREAM' : t < 2.2 ? 'RESOLVING FACE MESH' : 'LOCKING 5-POINT LANDMARKS';
      st.textContent = `${phase}  //  ${arrived}/${V.length} NODES  //  ${Math.floor(clamp(t / GRANT) * 100)}%`;
      st.style.color = ''; big.style.opacity = 0; sub.style.opacity = 0;
    } else {
      const d = t - GRANT;
      st.textContent = 'IDENTITY CONFIRMED  //  MATCH 98.7%'; st.style.color = '#2fd18b';
      big.style.opacity = clamp(d / 0.2); big.style.transform = `scale(${1 + Math.max(0, 0.3 - d) * 0.4})`;
      sub.style.opacity = clamp((d - 0.3) / 0.3); sub.textContent = `WELCOME BACK, ${NAME}`;
    }
    if (FT == null && !RM) requestAnimationFrame(frame);
  }
  frame();
  if (FT != null || RM) document.fonts && document.fonts.ready.then(frame);
})();
</script>
</body>
</html>
